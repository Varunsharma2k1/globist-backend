# Optional local stack so you can switch real connections on without cloud
# accounts:  docker compose up -d   then copy the URLs below into .env
#   MONGO_URI=mongodb://localhost:27017/triptape
#   DATABASE_URL=postgres://triptape:triptape@localhost:5432/triptape   PG_SSL=false
#   REDIS_URL=redis://localhost:6379
#   R2_ENDPOINT=http://localhost:9000  R2_ACCESS_KEY_ID=minio  R2_SECRET_ACCESS_KEY=minio12345
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo:/data/db]
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: triptape, POSTGRES_PASSWORD: triptape, POSTGRES_DB: triptape }
    ports: ["5432:5432"]
    volumes: [pg:/var/lib/postgresql/data]
  redis:
    image: valkey/valkey:8
    ports: ["6379:6379"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345 }
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
volumes: { mongo: {}, pg: {}, minio: {} }
